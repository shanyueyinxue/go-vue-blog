<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        .content {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 8px 8px;
        }

        .verification-code {
            background: #fff;
            border: 2px dashed #667eea;
            padding: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #667eea;
            margin: 20px 0;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 4px;
            margin: 15px 0;
            color: #856404;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>{{.Subject}}</h1>
        </div>
        <div class="content">
            <p>尊敬的 <strong>{{.Username}}</strong>，您好！</p>

            <p>您正在执行邮箱验证操作，请使用以下验证码完成验证：</p>

            <div class="verification-code">
                {{.Code}}
            </div>

            <div class="warning">
                ⚠️ 安全提示：
                <ul>
                    <li>有效期{{.Expiry}} 秒，请在此验证码 <strong>{{.ValidMinutes}} 分钟</strong>内输入</li>
                    <li>请勿将验证码透露给他人</li>
                    <li>{{.Note}}</li>
                    <li>如非本人操作，请忽略此邮件</li>
                </ul>
            </div>
        </div>

        <div class="footer">
            <p>此邮件由系统自动发送，请勿回复</p>
        </div>
    </div>
</body>

</html>
