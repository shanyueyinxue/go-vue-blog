name: Build and Release

on:
  push:
    tags:
      - 'v*'   # 推送 v1.0.0, v2.1.3 等标签时触发

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----- 构建前端 (Vue) -----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build    # 生成 frontend/dist
        # 如果前端在根目录，去掉 cd frontend

      # ----- 构建后端 (Go) 跨平台 -----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # 改成你需要的版本

      # 编译 Linux amd64
      - name: Build for Linux
        run: |
          cd backend
          GOOS=linux GOARCH=amd64 go build -o blog-server-linux-amd64
        # 如果后端在根目录，去掉 cd backend

      # 编译 Windows amd64
      - name: Build for Windows
        run: |
          cd backend
          GOOS=windows GOARCH=amd64 go build -o blog-server-windows-amd64.exe

      # 编译 macOS amd64
      - name: Build for macOS
        run: |
          cd backend
          GOOS=darwin GOARCH=amd64 go build -o blog-server-darwin-amd64

      # ----- 打包前端产物（可选）-----
      # 将 frontend/dist 压缩成 zip，方便上传
      - name: Package frontend
        run: |
          cd frontend
          zip -r ../blog-frontend-dist.zip dist/

      # ----- 创建 Release 并上传资产 -----
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # 上传所有构建产物（可执行文件 + 前端压缩包）
          files: |
            backend/blog-server-linux-amd64
            backend/blog-server-windows-amd64.exe
            backend/blog-server-darwin-amd64
            blog-frontend-dist.zip
          # 让 GitHub 自动根据 commit 信息生成 Release Notes
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 默认就有，无需手动配置