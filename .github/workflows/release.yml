name: Build and Release

on:
  push:
    tags:
      - 'v*'   # 推送 v1.0.0, v2.1.3 等标签时触发

permissions:
  contents: write   # 允许 softprops/action-gh-release 创建 Release 并上传资产

jobs:
  # ---------- 前端构建（只构建一次） ----------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # 需满足 frontend/package.json engines 要求
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Package frontend dist
        run: |
          cd frontend
          zip -r ../blog-frontend-dist.zip dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: blog-frontend-dist.zip
          if-no-files-found: error

  # ---------- 后端构建（三平台 matrix，CGO 开启） ----------
  # 后端使用 gorm.io/driver/sqlite -> mattn/go-sqlite3，依赖 CGO。
  # 各平台在本机 runner 上以 CGO_ENABLED=1 编译，避免交叉编译缺 C 编译器的问题。
  # macOS runner 为 arm64，通过 GOARCH=amd64 交叉编译出 amd64 产物（clang 原生支持多架构）。
  build-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            artifact: blog-server-linux-amd64
          - os: windows-latest
            goos: windows
            artifact: blog-server-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            artifact: blog-server-darwin-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Build backend
        shell: bash
        run: |
          # Windows 上确保 MinGW gcc 可用（MSYS2 预装但默认不在 PATH）
          if [ "${{ matrix.goos }}" = "windows" ] && [ -d "/c/msys64/mingw64/bin" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
          fi
          cd backend
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=amd64 go build -o "../${{ matrix.artifact }}"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.goos }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ---------- 创建 Release 并上传资产 ----------
  release:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blog-server-linux-amd64
            dist/blog-server-windows-amd64.exe
            dist/blog-server-darwin-amd64
            dist/blog-frontend-dist.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
